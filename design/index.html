<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <!-- Link to the stylesheet -->
  <link rel="stylesheet" href="styles.css">
  
  <title>Frontend Mentor | QR code component [ by Rik ]</title>
</head>
<body>
<main>
  <article class="card">
    <header class="card-header">
    <img src="./images/image-qr-code.png" alt="QR code image" class="qr-code">
    </header>
    <h1 class="title">Improve your front-end skills by building projects</h1>
    <p class="description">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
  </article>
</main>
</body>
</html>
